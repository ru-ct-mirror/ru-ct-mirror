name: sync

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

# Optional: a healthchecks.io ping URL stored as the HC_PING_URL secret. Every
# run reports start, exit status and a log excerpt there, so a missing run is
# noticed too. Steps that use it are no-ops when the secret is absent.
env:
  HC_PING_URL: ${{ secrets.HC_PING_URL }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Report start to healthchecks
        run: |
          [ -n "$HC_PING_URL" ] || exit 0
          # rid ties the start and the end ping together and must be a UUID.
          rid="$(uuidgen)"
          echo "HC_RID=$rid" >> "$GITHUB_ENV"
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL/start?rid=$rid" || true
      # ructmirror exits 2 when a log failed verification (evidence written),
      # 1 for operational errors such as an unreachable log. It must run as a
      # binary: `go run` collapses every non-zero status to 1.
      - name: Build
        run: go build -o ructmirror ./cmd/ructmirror
      - name: Sync all logs
        id: sync
        run: |
          set +e
          ./ructmirror sync 2>&1 | tee sync.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Offline verification of the whole mirror
        id: verify
        run: |
          set +e
          ./ructmirror verify 2>&1 | tee verify.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Commit and push whatever was observed
        id: publish
        if: always()
        env:
          TZ: UTC
        run: |
          git add data loglist
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git -c user.name=ru-ct-mirror -c user.email=ru-ct-mirror@proton.me \
            commit -q -m "sync $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
      - name: Open an issue on failure
        if: always() && (steps.sync.outputs.code != '0' || steps.verify.outputs.code != '0')
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_CODE: ${{ steps.sync.outputs.code }}
          VERIFY_CODE: ${{ steps.verify.outputs.code }}
        run: |
          if [ "$SYNC_CODE" = "2" ] || [ "$VERIFY_CODE" != "0" ]; then
            title="Verification failure $(date -u +%Y-%m-%d)"
          else
            title="Sync error $(date -u +%Y-%m-%d)"
          fi
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"$'\n'
          body+="sync exit code: $SYNC_CODE, verify exit code: $VERIFY_CODE"$'\n\n'
          for f in $(git ls-files -o -c data/*/*/alerts | sort | tail -n 20); do
            body+="- $f"$'\n'
          done
          if gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "issue already open"
          else
            gh issue create --title "$title" --body "$body"
          fi
          exit 1
      - name: Report outcome to healthchecks
        if: always()
        env:
          SYNC_CODE: ${{ steps.sync.outputs.code }}
          VERIFY_CODE: ${{ steps.verify.outputs.code }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          [ -n "$HC_PING_URL" ] || exit 0
          # healthchecks reads the exit status from the URL: 0 is success,
          # anything else is a failure. Pass the worst of the two steps,
          # 3 when a step never produced a code (the job itself broke) and
          # 4 when everything verified but the commit could not be pushed.
          code="${SYNC_CODE:-3}"
          if [ "${VERIFY_CODE:-3}" != "0" ] && [ "$code" != "2" ]; then code="${VERIFY_CODE:-3}"; fi
          if [ "$code" = "0" ] && [ "$PUBLISH" != "success" ]; then code=4; fi
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "sync exit code: ${SYNC_CODE:-none}, verify exit code: ${VERIFY_CODE:-none}, publish: ${PUBLISH:-none}"
            echo; echo "== sync"; grep -v -E ' 0 chunk\(s\), new STH: false$' sync.log 2>/dev/null | tail -n 40
            echo; echo "== verify"; grep -v ': ok, ' verify.log 2>/dev/null | tail -n 20
          } > hc-body.txt
          curl -fsS -m 10 --retry 3 -o /dev/null --data-binary @hc-body.txt \
            "$HC_PING_URL/$code${HC_RID:+?rid=$HC_RID}" || true

  # Publishes the list of issued names to GitHub Pages from whatever data/
  # now holds, after the sync job has pushed. It runs even when sync failed,
  # so the site never goes stale because a log was down, but it re-verifies
  # the stored entries first and does not deploy when they no longer match
  # the verified tree: the previous deployment stays up instead. Nothing
  # generated here is committed: Pages must be set to "GitHub Actions" as
  # its source (see docs/OPERATIONS.md). On a fork without Pages this job
  # fails and is ignored.
  pages:
    needs: sync
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # github.sha is the commit that triggered the run, i.e. from before
          # sync pushed. Fetch the branch tip instead.
          ref: ${{ github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o ructmirror ./cmd/ructmirror
      # The site is derived from the entries, not from anything the logs
      # signed. Publish only what still hashes to the verified roots.
      - name: Offline verification of the data the site is built from
        run: ./ructmirror verify
      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          ./ructmirror domains > _site/domains.tsv
          ./ructmirror domains -active > _site/domains-active.tsv
          tail -n +2 _site/domains-active.tsv | cut -f1 > _site/domains-active.txt
          jq -n \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg repo "${{ github.server_url }}/${{ github.repository }}" \
            '{generated: $generated, commit: $commit, repository: $repo,
              shards: [inputs | {
                shard: (input_filename | sub("^data/"; "") | sub("/state.json$"; "")),
                tree_size, root_hash, updated}]}' \
            data/*/*/state.json > _site/meta.json
          ls -la _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
